[project]
name = "local-telegram-bot"
version = "1.0.3"
description = "本地 AI Telegram Bot with Ollama + Function Calling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot==21.6",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "beautifulsoup4==4.12.3",
    "ddgs>=9.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.23.7",
    "ruff==0.6.9",
]

[tool.uv.sources]
# 本地套件來源 (非必要)
# local-telegram-bot = { path = "." }

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["test"]
pythonpath = ["."]
